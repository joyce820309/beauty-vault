name: Supabase keep-alive

on:
  schedule:
    # Run daily away from the top of the hour to reduce GitHub schedule delays.
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Supabase REST API without returning rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "Missing repository Actions secrets: SUPABASE_URL and SUPABASE_ANON_KEY" >&2
            exit 1
          fi

          status=$(curl --silent --show-error --fail \
            --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 30 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/items?select=id&limit=0")

          echo "Supabase REST API responded with HTTP $status (no rows requested)."